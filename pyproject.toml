[project]
name = "artifactory-navigator"
version = "0.4.20251028"
description = "The Windows native Artifactory Navigator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-cosmos>=4.9.0",
    "azure-storage-blob>=12.26.0",
    "cryptography>=45.0.5",
    "dohq-artifactory>=1.0.1",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "keyring>=25.6.0",
    "pip-system-certs>=5.2",
    "python-dotenv>=1.1.1",
    "pywin32>=311",
    "requests>=2.32.4",
    "wxpython>=4.2.3",
]

[dependency-groups]
dev = [
    "isort>=6.1.0",
    "jupyter>=1.1.1",
    "pyinstaller>=6.16.0",
    "rich>=14.3.3",
    "ruff>=0.14.0",
    "wat>=0.7.0",
]
